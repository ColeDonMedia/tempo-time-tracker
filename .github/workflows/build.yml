name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write   # needed to attach files to a release

jobs:
  build:
    runs-on: windows-latest
    # Code signing is optional: add two repository secrets to turn it on.
    #   SIGNING_CERT_BASE64   = base64 of a .pfx code-signing certificate
    #   SIGNING_CERT_PASSWORD = its password
    # The secrets are only handed to the signing steps (never to build or test steps that run repo code),
    # and signing never runs for pull requests.
    env:
      CAN_SIGN: ${{ secrets.SIGNING_CERT_BASE64 != '' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test (build + self-test suite)
        shell: pwsh
        run: ./scripts/test.ps1

      - name: Build (Release, warnings as errors)
        run: dotnet build Tempo.csproj -c Release -warnaserror

      - name: Publish single-file exe
        run: >
          dotnet publish Tempo.csproj -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -o publish

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = ([xml](Get-Content Tempo.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "version=$v" >> $env:GITHUB_OUTPUT

      # The certificate is decoded and deleted inside each signing step, so it is never on disk
      # while other tools (dotnet, choco, Inno Setup) run.
      - name: Sign Tempo.exe
        if: env.CAN_SIGN == 'true'
        shell: pwsh
        env:
          SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: ./scripts/sign.ps1 publish\Tempo.exe "Tempo"

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" "/DSourceExe=..\publish\Tempo.exe" installer\tempo.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign installer
        if: env.CAN_SIGN == 'true'
        shell: pwsh
        env:
          SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: ./scripts/sign.ps1 dist\Tempo-Setup-${{ steps.ver.outputs.version }}.exe "Tempo Setup"

      - name: Checksums (for winget manifests)
        shell: pwsh
        run: |
          Get-FileHash publish\Tempo.exe, dist\*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } | Tee-Object dist\SHA256SUMS.txt


      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tempo-win-x64
          path: |
            publish/Tempo.exe
            dist/*.exe
            dist/SHA256SUMS.txt

      # Push a tag like v2.6.0 to create a GitHub Release with the exe and installer attached.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/Tempo.exe
            dist/*.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
