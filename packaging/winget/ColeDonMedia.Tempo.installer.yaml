# winget manifest template. Fill {VERSION} and {SHA256} from the GitHub release
# (CI prints the installer's SHA-256 in the Release job), then submit to microsoft/winget-pkgs,
# e.g. with:  wingetcreate update ColeDonMedia.Tempo --version {VERSION} --urls <installer url>
PackageIdentifier: ColeDonMedia.Tempo
PackageVersion: {VERSION}
MinimumOSVersion: 10.0.17763.0
InstallerType: inno
Scope: user
InstallModes:
  - interactive
  - silent
UpgradeBehavior: install
Dependencies:
  PackageDependencies:
    - PackageIdentifier: Microsoft.DotNet.DesktopRuntime.8
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/ColeDonMedia/tempo-time-tracker/releases/download/v{VERSION}/Tempo-Setup-{VERSION}.exe
    InstallerSha256: {SHA256}
ManifestType: installer
ManifestVersion: 1.6.0
